version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      npm-development:
        dependency-type: development
    ignore:
      # typescript-eslint pins peer typescript to ">=4.8.4 <6.1.0" as of 8.65.0,
      # so a TypeScript major makes `npm ci` unresolvable and CI dies at install
      # before a single test runs. Drop this ignore once typescript-eslint ships
      # a release whose peer range admits the next major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
    open-pull-requests-limit: 5
